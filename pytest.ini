[pytest]
testpaths = apps packages
addopts = --import-mode=importlib
norecursedirs =
    .git
    .venv
    .pytest_cache
    old
    openspec
markers =
    integration: opt-in tests requiring real external integrations
    live_llm: opt-in tests that call a real LLM provider
    live_tavily: opt-in tests that call the real Tavily API
    live_hpc: opt-in tests that call a reachable HPC runner or cluster
    live_e2e: opt-in end-to-end tests over real external dependencies
    seeded_live_smoke: opt-in seeded smoke over live providers; not a full live_e2e gate
    podman: tests that require a real rootless Podman sandbox
    quality_eval: opt-in workflow quality evals that may be slower or costlier
    slow: longer-running tests that are not part of fast default feedback loops
