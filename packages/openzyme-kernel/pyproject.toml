[project]
name = "openzyme-kernel"
version = "0.1.0"
description = "OpenZyme canonical collaboration and capability-resolution kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
  "openzyme-extension-spi",
  "openzyme-runtime-spi",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_kernel"]

[tool.openzyme.component]
component_id = "openzyme.kernel"
component_kind = "kernel"
migration_state = "foundation_active"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
