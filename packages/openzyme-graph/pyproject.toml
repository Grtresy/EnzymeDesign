[project]
name = "openzyme-graph"
version = "0.1.0"
description = "V2 graph contracts for OpenZyme"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2.0",
  "openzyme-domain",
  "openzyme-engines",
  "openzyme-execution",
  "openzyme-research",
  "openzyme-runtime",
  "openzyme-storage",
  "openzyme-tools",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
