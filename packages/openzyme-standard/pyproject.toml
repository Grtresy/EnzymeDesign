[project]
name = "openzyme-standard"
version = "0.1.0"
description = "官方无必需语义插件 Distribution 元数据"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
  "openzyme-extension-spi",
  "openzyme-kernel",
  "openzyme-host-api",
  "openzyme-process-podman",
  "openzyme-runtime-llm",
  "openzyme-store-sqlite",
  "openzyme-workspace-git-lfs",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_standard"]

[tool.openzyme.component]
component_id = "openzyme.standard"
component_kind = "distribution"
migration_state = "target_distribution_activatable"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
