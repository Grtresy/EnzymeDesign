[project]
name = "openzyme-execution-contracts"
version = "0.1.0"
description = "runner 与 Compute 之间的闭合执行 wire contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_execution_contracts"]

[tool.openzyme.component]
component_id = "openzyme.execution.contracts"
component_kind = "capability_contracts"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "openzyme.execution.contracts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
