[project]
name = "enzymedesign-bio-providers"
version = "0.1.0"
description = "UniProt、RCSB 与 InterPro 产品能力插件"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "enzymedesign-core",
  "openzyme-contracts",
  "openzyme-extension-spi",
]

[project.entry-points."openzyme.extensions"]
"enzymedesign.bio-providers" = "enzymedesign_bio_providers.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = ["pytest>=9.0.0"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enzymedesign_bio_providers"]

[tool.openzyme.component]
component_id = "enzymedesign.bio-providers"
component_kind = "product_plugin"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
