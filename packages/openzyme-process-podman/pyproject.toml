[project]
name = "openzyme-process-podman"
version = "0.1.0"
description = "本地隔离进程与 WorkspaceProcess Port Adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
  "openzyme-extension-spi",
  "openzyme-runtime-spi",
]

[project.entry-points."openzyme.extensions"]
"openzyme.process.podman" = "openzyme_process_podman.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_process_podman"]

[tool.openzyme.component]
component_id = "openzyme.process.podman"
component_kind = "adapter"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
