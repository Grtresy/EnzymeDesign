[project]
name = "openzyme-runtime"
version = "0.1.0"
description = "Phase B runtime foundation for OpenZyme"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.0,<2.0",
  "openzyme-domain",
  "openzyme-research",
  "openzyme-storage",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]
openai = [
  "langchain-openai>=1.0,<2.0",
]
postgres = [
  "langgraph-checkpoint-postgres>=2.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
