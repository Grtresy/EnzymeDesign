[project]
name = "enzymedesign-hmmer"
version = "0.1.0"
description = "HMMER typed tool 与 Driver 插件"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "enzymedesign-core",
  "openzyme-contracts",
  "openzyme-execution-contracts",
  "openzyme-extension-spi",
]

[project.entry-points."openzyme.extensions"]
"enzymedesign.hmmer" = "enzymedesign_hmmer.manifest_locator:locate_component_manifest"
"enzymedesign.hmmer.hpc" = "enzymedesign_hmmer.manifest_locator:locate_hpc_driver_manifest"
"enzymedesign.hmmer.local" = "enzymedesign_hmmer.manifest_locator:locate_local_driver_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enzymedesign_hmmer"]

[tool.openzyme.component]
component_id = "enzymedesign.hmmer"
component_kind = "product_plugin"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "enzymedesign"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
