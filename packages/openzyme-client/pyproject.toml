[project]
name = "openzyme-client"
version = "0.1.0"
description = "公开 HTTP/媒体契约客户端边界"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_client"]

[tool.openzyme.component]
component_id = "openzyme.client"
component_kind = "client"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
