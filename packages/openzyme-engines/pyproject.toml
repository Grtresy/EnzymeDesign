[project]
name = "openzyme-engines"
version = "0.1.0"
description = "V3 capability engine bridge package for OpenZyme"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "openzyme-core",
  "openzyme-domain",
  "openzyme-runtime",
  "openzyme-research",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_engines"]
