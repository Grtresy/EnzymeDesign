[project]
name = "openzyme-research-tavily"
version = "0.1.0"
description = "Research Plugin 的 Tavily Provider Adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
  "openzyme-extension-spi",
  "openzyme-research",
]

[project.entry-points."openzyme.extensions"]
"openzyme.research.tavily" = "openzyme_research_tavily.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]
tavily = [
  "tavily-python>=0.5.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_research_tavily"]

[tool.openzyme.component]
component_id = "openzyme.research.tavily"
component_kind = "adapter"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
