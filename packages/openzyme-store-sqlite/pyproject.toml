[project]
name = "openzyme-store-sqlite"
version = "0.1.0"
description = "Kernel control store 的 SQLite Adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
  "openzyme-extension-spi",
]

[project.entry-points."openzyme.extensions"]
"openzyme.store.sqlite" = "openzyme_store_sqlite.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_store_sqlite"]

[tool.openzyme.component]
component_id = "openzyme.store.sqlite"
component_kind = "adapter"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
