[project]
name = "openzyme-hpc-slurm"
version = "0.1.0"
description = "HPC Plugin 的 Slurm scheduler Adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
  "openzyme-execution-contracts",
  "openzyme-extension-spi",
  "openzyme-hpc",
]

[project.entry-points."openzyme.extensions"]
"openzyme.hpc.slurm" = "openzyme_hpc_slurm.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_hpc_slurm"]

[tool.openzyme.component]
component_id = "openzyme.hpc.slurm"
component_kind = "adapter"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "openzyme.hpc.slurm"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
