[project]
name = "openzyme-extension-spi"
version = "0.1.0"
description = "Implementation-free Adapter, Plugin, Driver and Distribution SPI for OpenZyme"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_extension_spi"]

[tool.openzyme.component]
component_id = "openzyme.extension-spi"
component_kind = "extension_spi"
migration_state = "foundation_active"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
