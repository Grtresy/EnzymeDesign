[project]
name = "openzyme-reporting"
version = "0.1.0"
description = "报告生命周期、渲染与验证插件"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
  "openzyme-extension-spi",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[project.entry-points."openzyme.extensions"]
"openzyme.reporting" = "openzyme_reporting.manifest_locator:locate_component_manifest"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_reporting"]

[tool.openzyme.component]
component_id = "openzyme.reporting"
component_kind = "plugin"
migration_state = "target_implemented_host_mount_pending"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
