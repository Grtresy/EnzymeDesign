[project]
name = "enzymedesign-alphafold"
version = "0.1.0"
description = "AlphaFold 能力与资源合同插件"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "enzymedesign-core",
  "openzyme-contracts",
  "openzyme-execution-contracts",
  "openzyme-extension-spi",
]

[project.entry-points."openzyme.extensions"]
"enzymedesign.alphafold" = "enzymedesign_alphafold.manifest_locator:locate_component_manifest"
"enzymedesign.alphafold.hpc" = "enzymedesign_alphafold.manifest_locator:locate_hpc_driver_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enzymedesign_alphafold"]

[tool.openzyme.component]
component_id = "enzymedesign.alphafold"
component_kind = "product_plugin"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
