[project]
name = "openzyme-workspace-git-lfs"
version = "0.1.0"
description = "Git/LFS workspace 与 publication mechanism Adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openzyme-contracts",
  "openzyme-extension-spi",
  "pydantic>=2.10,<3.0",
]

[project.entry-points."openzyme.extensions"]
"openzyme.workspace.git.lfs" = "openzyme_workspace_git_lfs.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_workspace_git_lfs"]

[tool.openzyme.component]
component_id = "openzyme.workspace.git.lfs"
component_kind = "adapter"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
