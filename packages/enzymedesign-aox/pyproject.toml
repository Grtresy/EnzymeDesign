[project]
name = "enzymedesign-aox"
version = "0.1.0"
description = "AOX workflow、规则与验收插件"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "enzymedesign-core",
  "openzyme-contracts",
  "openzyme-extension-spi",
  "openzyme-science",
]

[project.entry-points."openzyme.extensions"]
"enzymedesign.aox" = "enzymedesign_aox.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enzymedesign_aox"]

[tool.openzyme.component]
component_id = "enzymedesign.aox"
component_kind = "product_plugin"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
