[project]
name = "preprocess-backend"
version = "0.1.0"
description = "Local molecular preprocessing adapters for OpenZyme execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
chem = [
  "rdkit>=2024.9.1",
  "meeko>=0.6.1",
  "openbabel-wheel>=3.1.1.22",
]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preprocess_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
