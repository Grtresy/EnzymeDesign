[project]
name = "openzyme-research"
version = "0.1.0"
description = "Research adapters and normalized research outputs for OpenZyme"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
  "openzyme-extension-spi",
]

[project.entry-points."openzyme.extensions"]
"openzyme.research" = "openzyme_research.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_research"]

[tool.openzyme.component]
component_id = "openzyme.research"
component_kind = "plugin"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "integration: opt-in tests requiring real external integrations",
  "live_tavily: opt-in tests that call the real Tavily API",
]
