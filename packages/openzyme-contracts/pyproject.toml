[project]
name = "openzyme-contracts"
version = "0.1.0"
description = "Implementation-free OpenZyme kernel and extension contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_contracts"]

[tool.openzyme.component]
component_id = "openzyme.contracts"
component_kind = "contracts"
migration_state = "foundation_active"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
