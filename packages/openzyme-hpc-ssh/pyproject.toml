[project]
name = "openzyme-hpc-ssh"
version = "0.1.0"
description = "HPC Plugin 的 SSH/SFTP/rsync Adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
  "openzyme-execution-contracts",
  "openzyme-extension-spi",
]

[project.scripts]
openzyme-workspace-runtime = "openzyme_hpc_ssh.workspace_runtime:main"

[project.entry-points."openzyme.extensions"]
"openzyme.hpc.ssh" = "openzyme_hpc_ssh.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_hpc_ssh"]

[tool.openzyme.component]
component_id = "openzyme.hpc.ssh"
component_kind = "adapter"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "openzyme.hpc.ssh"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
