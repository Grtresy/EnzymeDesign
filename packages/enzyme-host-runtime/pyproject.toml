[project]
name = "enzyme-host-runtime"
version = "0.1.0"
description = "Shared host runtime services for Enzyme CLI and Web surfaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp-project-memory",
  "mcp-hpc-tool-contracts",
  "preprocess-backend",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.uv.sources]
mcp-project-memory = { workspace = true }
mcp-hpc-tool-contracts = { workspace = true }
preprocess-backend = { workspace = true }

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enzyme_host_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
