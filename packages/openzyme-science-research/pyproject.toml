[project]
name = "openzyme-science-research"
version = "0.1.0"
description = "显式组合的科学文献来源与证据 quorum 插件"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-contracts",
  "openzyme-extension-spi",
  "openzyme-research",
  "openzyme-science",
]

[project.entry-points."openzyme.extensions"]
"openzyme.science-research" = "openzyme_science_research.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = ["pytest>=9.0.0"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_science_research"]

[tool.openzyme.component]
component_id = "openzyme.science-research"
component_kind = "plugin"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
