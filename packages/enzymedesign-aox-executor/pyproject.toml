[project]
name = "enzymedesign-aox-executor"
version = "0.1.0"
description = "AOX deterministic calculation and supervised execution Driver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "biopython==1.87",
  "enzymedesign-aox",
  "numpy==2.4.4",
  "openzyme-execution-sdk",
  "openzyme-extension-spi",
]

[project.entry-points."openzyme.extensions"]
"enzymedesign.aox.executor" = "enzymedesign_aox_executor.manifest_locator:locate_component_manifest"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enzymedesign_aox_executor"]

[tool.openzyme.component]
component_id = "enzymedesign.aox.executor"
component_kind = "driver"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "uncomposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
