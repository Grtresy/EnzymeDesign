[project]
name = "openzyme-execution"
version = "0.1.0"
description = "Execution adapters for the OpenZyme V3 execution engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openzyme-domain",
  "openzyme-runtime",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_execution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
