[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enzyme-design"
version = "0.1.0"
description = "Enzyme Shrinkage Closed-Loop Pipeline (Snakemake)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.19",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.23",
    "snakemake>=7.32.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
