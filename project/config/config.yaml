mode: mock
fail_tool: null
conda_frontend: mamba

target_id: enzyme_shrink_demo

cache:
  dir: cache
  mode: hardlink

retries:
  max_retries: 2
  backoff_seconds: 2

features:
  pockets: true
  tunnels: true
  docking: true

structure_backends:
  - esmfold
  - omegafold
  - openfold
structure_primary_backend: esmfold
structure_backend_configs:
  esmfold:
    executable: /path/to/esmfold
    model_weights: /path/to/esmfold_weights.pt
    args: []
  omegafold:
    executable: /path/to/omegafold
    model_weights: /path/to/omegafold_weights.pt
    args: []
  openfold:
    executable: /path/to/openfold
    model_weights: /path/to/openfold_weights.pt
    args: []

hhblits_db: /path/to/hhblits_db
hhblits:
  evalue: 1e-3
  num_iterations: 3
  maxseq: 10000
  cpu: 4
  extra_args: []

scoring:
  weights:
    S_shrink: 0.55
    S_struct: 0.20
    S_mut_risk: 0.15
    S_cons: 0.10
    S_function_guard: 0.00
  keep_bonus: 0.02
  drop_score: -1.0
  missing_penalty: 0.08

conservation_thresholds:
  fixed: 0.8
  masked: 0.3

esm3:
  num_samples: 50
  temperature: 0.7
  max_length_delta: 20
