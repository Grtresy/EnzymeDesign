[project]
name = "preprocess-backend"
version = "0.1.0"
description = "Local molecular preprocessing operations for MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openbabel-wheel>=3.1.1.22",
  "rdkit>=2024.3.6",
  "meeko>=0.6.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preprocess_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
