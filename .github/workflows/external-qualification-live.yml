name: External qualification operator gate

on:
  workflow_dispatch:
    inputs:
      operator_id:
        description: Audited operator identity
        required: true
        type: string
      qualification_batch:
        description: Batch to inspect; this workflow remains plan-only
        required: true
        type: choice
        options:
          - batch-1
          - batch-2-alphafold
          - both-plan-only
      protected_environment:
        description: Protected GitHub environment selected by the operator
        required: true
        type: string
      execution_mode:
        description: This readiness change permits plan-only execution
        required: true
        type: choice
        options:
          - plan-only

permissions:
  contents: read

jobs:
  readiness-plan-only:
    runs-on: ubuntu-latest
    environment: ${{ inputs.protected_environment }}
    timeout-minutes: 20
    env:
      OPENZYME_ALLOW_LIVE: "0"
      OPENZYME_LOAD_ENV_FILES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Refuse live execution until an exact occurrence is approved
        run: |
          test "${{ inputs.execution_mode }}" = "plan-only"
          echo "Requested plan scope: ${{ inputs.qualification_batch }}"
          echo "Live qualification remains blocked before occurrence authorization."
      - name: Produce source-bound identity gaps and dry plans
        run: >-
          uv run python scripts/build-external-qualification-dry-plan.py
          openspec/changes/qualify-enzymedesign-external-capability-routes/operator/safe-identity-snapshot-20260822.json
          /tmp/operator-qualification-plan.json
          --decision-selections
          openspec/changes/qualify-enzymedesign-external-capability-routes/operator/approved-identity-resolution-selections-20260822.json
      - uses: actions/upload-artifact@v4
        with:
          name: enzymedesign-external-qualification-plan
          path: /tmp/operator-qualification-plan.json
          if-no-files-found: error
