[cluster]
ssh_host = "hpc-login"
ssh_user = ""
remote_base_dir = "mcp_runs"

[slurm]
default_partition = "cpu"
gpu_partition = "gpu"
gpu_flag_style = "gpus" # one of: gpus, gres
time_threshold_minutes = 60
mem_threshold_mb = 32768

[execution]
default_mode = "auto"
create_remote_dir_for_ssh = true
artifact_root = "../.mcp_hpc_runner/artifacts"
use_rsync = true

[logging]
inline_log_limit = 4096
redact_patterns = [
  "(?i)(password|passwd|token|secret|api[_-]?key)\\s*[=:]\\s*[^\\s]+",
]
