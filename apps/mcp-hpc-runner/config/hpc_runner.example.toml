[runner]
deployment_id = "local-runner"
# OpenSSH ControlPath is a Unix socket with a short byte limit. Keep this root
# absolute, short, private, and deployment-scoped; the runner creates it as 0700
# and rejects foreign ownership metadata rather than reusing it.
transport_control_root = "/tmp/ozhpc-local-runner"

[cluster]
ssh_host = "hpc-login"
ssh_user = ""
remote_base_dir = "mcp_runs"
credential_policy_id = "ssh-agent-default-v1"
host_key_policy_id = "system-known-hosts-v1"

[ssh_transport]
# Keep disabled for new admissions until deterministic transport/fault gates and
# the explicitly opted-in, non-scientific real-SSH soak pass for this deployment.
# controlmaster_v1 reuses authentication only: every action remains an isolated
# bounded channel, and no caller/RunSpec may override any field in this section.
mode = "disabled" # disabled | controlmaster_v1
control_persist_seconds = 300
max_channels_per_target = 4
connect_attempts = 1
pre_effect_recovery_attempts = 1
backoff_initial_seconds = 0.25
backoff_multiplier = 2.0
backoff_max_seconds = 2.0
health_check_interval_seconds = 30.0
health_check_timeout_seconds = 5.0
channel_acquire_timeout_seconds = 30.0
shutdown_timeout_seconds = 10.0

[executor_workspace]
# Activation requires real credential-provider/authenticator integration plus
# target-native positive and negative qualification receipts. C2 lease state or
# configuration alone is never sufficient. Native workspace credentials never
# carry scheduler-submit/sbatch authority; C9 installs that separate gate.
activated = false
target_profile_id = "unconfigured"
workspace_root = "/var/empty/openzyme-hpc-disabled"
sidecar_root = "/var/empty/openzyme-hpc-sidecar-disabled"
os_principal_policy_id = "unconfigured"
# root_policy_digest = "sha256:..."
# isolation_command = "/usr/local/libexec/openzyme-workspace-isolation"
credential_provider_id = "unconfigured"
authenticator_id = "unconfigured"
login_alias = "unconfigured"
# inventory_generation = 1
# inventory_digest = "sha256:..." # exact TargetToolchainInventory closure
# native_positive_proof_digest = "sha256:..."
# native_negative_proof_digest = "sha256:..."

[slurm]
default_partition = "" # optional; leave empty to use cluster default
gpu_partition = ""     # optional; leave empty to use cluster default
allowed_partitions = [] # optional allowlist for caller-selected partitions
gpu_flag_style = "gpus" # one of: gpus, gres
time_threshold_minutes = 60
mem_threshold_mb = 32768

[execution]
use_rsync = true
# use_rsync controls bounded native workspace transfer. Current
# workspace RunSpec rejects artifact inputs, HpcStageRef, stage_to, expected
# output fetch and arbitrary remote paths before external action.

[limits]
max_cpus = 64
max_mem_mb = 524288
max_gpus = 8
max_time_minutes = 10080
max_tail_lines = 5000

[logging]
inline_log_limit = 4096
redact_patterns = [
  "(?i)(password|passwd|token|secret|api[_-]?key)\\s*[=:]\\s*[^\\s]+",
]

# 领域软件、版本、模型资产、数据库和 Driver 选择不属于 runner 配置。
# Tool Plugin 声明 requirement；operator qualification 生成结构化 target
# inventory；Distribution 显式选择 Plugin/Driver。Runner 只校验请求绑定的
# exact inventory generation/digest，不接受任意 [adapters.*] catalog。
