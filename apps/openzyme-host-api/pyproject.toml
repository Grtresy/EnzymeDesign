[project]
name = "openzyme-host-api"
version = "0.1.0"
description = "V3 Host API app for OpenZyme"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openzyme-contracts",
  "openzyme-kernel",
  "openzyme-extension-spi",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2.0",
]
server = [
  "uvicorn>=0.30,<1.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_host_api"]

[tool.openzyme.component]
component_id = "openzyme.host.api"
component_kind = "delivery_adapter"
migration_state = "target_implemented_not_cutover"
current_composition_owner = "self"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "architecture_qualification_scenario: closed deterministic V3 architecture qualification scenario",
  "integration: opt-in tests requiring real external integrations",
  "live_llm: opt-in tests that call a real LLM provider",
  "live_tavily: opt-in tests that call the real Tavily API",
  "live_hpc: opt-in tests that call a reachable HPC runner or cluster",
  "live_e2e: opt-in end-to-end tests over real external dependencies",
  "seeded_live_smoke: opt-in seeded smoke over live providers; not a full live_e2e gate",
  "quality_eval: opt-in workflow quality evals that may be slower or costlier",
  "slow: longer-running tests that are not part of fast default feedback loops",
]
