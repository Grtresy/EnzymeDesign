[project]
name = "openzyme-host-api"
version = "0.1.0"
description = "V2 Host API app and contracts for OpenZyme"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langsmith>=0.3,<1.0",
  "openzyme-domain",
  "openzyme-graph",
  "openzyme-runtime",
  "openzyme-storage",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_host_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
