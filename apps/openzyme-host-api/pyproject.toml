[project]
name = "openzyme-host-api"
version = "0.1.0"
description = "V2 Host API app and contracts for OpenZyme"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langchain-openai>=1.0,<2.0",
  "langsmith>=0.3,<1.0",
  "openzyme-domain",
  "openzyme-execution",
  "openzyme-graph",
  "openzyme-research[tavily]",
  "openzyme-runtime",
  "openzyme-storage",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_host_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "integration: opt-in tests requiring real external integrations",
  "live_llm: opt-in tests that call a real LLM provider",
  "live_tavily: opt-in tests that call the real Tavily API",
  "live_hpc: opt-in tests that call a reachable HPC runner or cluster",
  "live_e2e: opt-in end-to-end tests over real external dependencies",
  "quality_eval: opt-in workflow quality evals that may be slower or costlier",
  "slow: longer-running tests that are not part of fast default feedback loops",
]
