[project]
name = "mcp-project-memory"
version = "0.1.0"
description = "MCP project memory server for project state and artifacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
mcp-project-memory = "mcp_project_memory.cli:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_project_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
