[project]
name = "enzyme-host-cli"
version = "0.1.0"
description = "Minimal host CLI/runtime for enzyme project workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp-project-memory",
  "mcp-hpc-tool-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
enzyme = "enzyme_host_cli.cli:main"

[tool.uv.sources]
mcp-project-memory = { workspace = true }
mcp-hpc-tool-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enzyme_host_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
