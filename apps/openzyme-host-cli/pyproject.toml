[project]
name = "openzyme-host-cli"
version = "0.1.0"
description = "Thin V3 CLI client for the OpenZyme Host API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1.0",
  "openzyme-runtime",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
openzyme = "openzyme_host_cli.cli:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openzyme_host_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
