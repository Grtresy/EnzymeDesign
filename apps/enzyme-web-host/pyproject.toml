[project]
name = "enzyme-web-host"
version = "0.1.0"
description = "Local web host for OpenZyme project workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "enzyme-host-runtime",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.2.0",
]

[project.scripts]
enzyme-web-host = "enzyme_web_host.__main__:main"

[tool.uv.sources]
enzyme-host-runtime = { workspace = true }

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enzyme_web_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
